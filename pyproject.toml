[project]
name = "trustcast"
version = "0.0.1"
description = "TRUSTCAST: hybrid AI-NWP multi-model forecast blending (SIH26081)"
requires-python = ">=3.12,<3.13"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: hits real network services; run explicitly with `pytest -m live`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["prototype", "web", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N818", "N803", "N806"]   # NotConfigured name fixed by the brief; X/Xt matrix names (ML convention)

[tool.ruff.lint.per-file-ignores]
"src/trustcast/alerts/bulletin.py" = ["E501"]
"src/trustcast/api/app.py" = ["E501", "N812"]   # endpoint one-liners; `schemas as S`   # bulletin sentence templates (EN/HI)
"scripts/*" = ["E501", "E402"]   # CLI report strings; sys.path/matplotlib setup before imports
