# Local deployment: API + web. The data pipeline (archiver, backfill, forecasts) runs on the host
# via scripts/ops (Windows Task Scheduler) or cron, writing into ./data which the API reads.
services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
  web:
    build: ./web
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
